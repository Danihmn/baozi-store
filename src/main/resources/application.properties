spring.application.name=baozi-store

# Banco de dados MySQL (os valores padrão servem apenas para desenvolvimento local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/baozistore}
spring.datasource.username=${DB_USER:baozi}
spring.datasource.password=${DB_PASSWORD:baozi123}

# JPA / Hibernate: cria e atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Erros em JSON, no formato Problem Details (RFC 9457)
spring.mvc.problemdetails.enabled=true
